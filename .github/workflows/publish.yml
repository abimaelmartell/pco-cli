name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Trusted publishing: GitHub OIDC, no NPM_TOKEN.
# The workflow filename must match the Trusted Publisher config on npmjs.com.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do not set registry-url: it writes an empty NODE_AUTH_TOKEN and
          # npm then skips OIDC trusted publishing (E404 on publish).
          package-manager-cache: false

      - name: Install npm CLI for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Publish
        run: |
          echo "npm $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is unset; GitHub OIDC is not available" >&2
            exit 1
          fi
          npm publish --access public
